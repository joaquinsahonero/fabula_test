<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto RXI</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene stats>
      <a-assets>
        <a-assets-item id="silla" src="assets/silla.glb">
      </a-assets>
      
      <a-entity gltf-model="#silla" position="0 0 -2.5" rotation="0 35 0"></a-entity>
      
      <a-entity camera="fov: 60" look-controls wasd-controls position="0 1.6 0"> </a-entity>
      <a-box position="1.5 0.5 -3" color="#4CC3D9"></a-box>

      <a-plane rotation ="-90 0 0" width="10" height="10" color="#78C8A4"></a-plane>
      
      <a-sky color="#222D62"></a-sky>
      <a-entity light="type: ambient; intesity: 0.6"></a-entity>
      <a-entity light="type directional; intensity: 0.8 position= 0.8"></a-entity>
      
    </a-scene>
  </body>
</html>
