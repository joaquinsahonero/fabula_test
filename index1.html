<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto RXI</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">

      <a-assets>
        <a-asset-item id="silla" src="assets/silla.glb"></a-asset-item>
      </a-assets>

      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>

      <a-entity class="clickable" gltf-model="#silla"
        position="-1.5 0 -3" rotation="0 35 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents:mouseenter"
        animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
        animation__click="property: rotation; from: 0 35 0; to: 0 395 0; dur: 1000; startEvents: click"
        ></a-entity>
        <a-text value="Toca la silla" position="-1.5 2 -3"
        align="center" width="4" color="#FFFFFF"></a-text>

        <a-box class="clickable" position="1.5 0.5 -3" color="#4CC3D9"
          animation__enter="property: scale; to: 1.2 1.2 1.2; dur: 200; startEvents: mouseenter"
          animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
          animation__click="property: rotation; from: 0 0 0; to: 0 360 0; dur: 1000; startEvents:click"
          ></a-box>
          <a-text value="Toca la caja" position="1.5 1.7 -3"
          align="center" width="4" color="#FFFFFF"></a-text>

          <a-plane rotation="-90 0 0" width="10" height="10" color="#78C8A4"></a-plane>
          <a-sky color="#222D62"></a-sky>

          <a-entity light="type: ambient; intensity: 0.6"></a-entity>
          <a-entity light="type: directional; intensity: 0.8" position="-1 2 1"></a-entity>


    </a-scene>
  </body>
</html>
